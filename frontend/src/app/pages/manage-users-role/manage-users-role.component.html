<div class="row">
  <div class="col-xl-12">
    <div class="w-100">
      <div class="radio-group text-center mb-3">
        <label class="radio-label">
          <input type="radio" name="color" value="pos" [(ngModel)]="selectedType" (change)="onTypeChange(selectedType)" /> POS
        </label>
        <label class="radio-label">
          <input type="radio" name="color" value="erp" [(ngModel)]="selectedType" (change)="onTypeChange(selectedType)" /> ERP
        </label>
      </div>
      <button type="button" [routerLink]="['/role/add']" class="btn btn-info float-end mb-3">Add User Roles</button>
      <div class="w-100">
        <app-table [tableHeaders]="headers" [tableData]="body" [dtOptions]="dtOptions" (edit)="onEdit($event)" (delete)="onDelete($event)"></app-table>
      </div>
    </div>
  </div>
</div>
